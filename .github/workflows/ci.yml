name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    # The web checks never touch a native toolchain, so they run on the cheapest
    # runner and leave the paid minutes for the three native builds below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:distribution
      - run: pnpm oxlint
      - run: pnpm oxfmt --check
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsc --noEmit -p tsconfig.test.json
      - run: pnpm test

  rust:
    name: rust (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: macOS }
          - { os: ubuntu-22.04, platform: Linux }
          - { os: windows-latest, platform: Windows }
    steps:
      - uses: actions/checkout@v7

      # wry links against the system WebKitGTK; nothing Rust-side resolves it.
      - name: Install Linux WebKit dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.os }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
