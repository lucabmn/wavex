name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One runner at a time. Every job appends to the same draft release and to
      # the same `latest.json`, and tauri-action reads that feed before it
      # rewrites it — in parallel the last writer drops the other platforms.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            target: aarch64-apple-darwin
            bundles: app,dmg
          # 22.04, not latest: the AppImage and the .deb both link the runner's
          # glibc, and building on 24.04 refuses to start on anything older.
          - os: ubuntu-22.04
            platform: Linux
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: windows-latest
            platform: Windows
            target: x86_64-pc-windows-msvc
            bundles: nsis
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # wry links against the system WebKitGTK; nothing Rust-side resolves it.
      - name: Install Linux WebKit dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.os }}

      - run: pnpm install --frozen-lockfile

      - name: Verify release inputs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs "${GITHUB_REF_NAME#v}"
          node scripts/verify-distribution.mjs
          # Only the macOS artifacts are code-signed. Windows and Linux ship
          # unsigned until certificates exist for them; the updater signature is
          # separate and required on every platform.
          required="TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            required="$required APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"
          fi
          for name in $required; do
            [ -n "${!name:-}" ] || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false ] || {
            echo "GitHub Releases cannot serve the unauthenticated updater while $GITHUB_REPOSITORY is private." >&2
            exit 1
          }

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          # Not openssl: the Windows runner's bash does not ship it.
          delimiter="notes-$(node -e "console.log(require('node:crypto').randomBytes(16).toString('hex'))")"
          echo "body<<$delimiter" >> "$GITHUB_OUTPUT"
          node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"

      - name: Build release draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: wavex v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}

      - name: Notarize and staple the disk image
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG=$(find target -type f -path '*/bundle/dmg/*.dmg' -print -quit)
          [ -n "$DMG" ]

          # Tauri notarizes and staples the .app, then only code-signs the disk
          # image, so the DMG is submitted here or it reaches users without a
          # ticket and Gatekeeper has to ask Apple online to open it.
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"

          # tauri-action already uploaded the unstapled disk image, and stapling
          # rewrites the file under an unchanged name, so the release asset is
          # replaced before anything verifies or publishes it.
          gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber

      - name: Verify Gatekeeper and updater artifacts
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          APP=$(find target -type d -path '*/bundle/macos/wavex.app' -print -quit)
          DMG=$(find target -type f -path '*/bundle/dmg/*.dmg' -print -quit)
          UPDATE=$(find target -type f -path '*/bundle/macos/*.app.tar.gz' -print -quit)
          [ -n "$APP" ] && [ -n "$DMG" ] && [ -n "$UPDATE" ]
          [ -s "$UPDATE.sig" ]

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2> "$RUNNER_TEMP/codesign.txt"
          grep -q 'Authority=Developer ID Application:' "$RUNNER_TEMP/codesign.txt"
          grep -Eq 'flags=.*runtime' "$RUNNER_TEMP/codesign.txt"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          spctl --assess --type execute --verbose=4 "$APP"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

      - name: Verify the installer and the signed update bundle
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail

          # Tauri names the update archive per platform and has changed those
          # names between majors, so assert the contract instead of the suffix:
          # a non-empty `.sig` next to the non-empty bundle it signs.
          SIG=$(find target -type f -path '*/bundle/*' -name '*.sig' -print -quit)
          [ -n "$SIG" ] || { echo "No signed update bundle was produced." >&2; exit 1; }
          [ -s "$SIG" ]
          [ -s "${SIG%.sig}" ]

          case "${{ matrix.os }}" in
            ubuntu-*)
              find target -type f -name '*.AppImage' -print -quit | grep -q .
              find target -type f -name '*.deb' -print -quit | grep -q .
              find target -type f -name '*.rpm' -print -quit | grep -q .
              ;;
            windows-*)
              find target -type f -name '*.exe' -path '*/bundle/*' -print -quit | grep -q .
              ;;
          esac

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Checked while the release is still a draft. Each build job rewrites the
      # one shared `latest.json`, and an overwrite instead of a merge leaves a
      # feed that names a single platform — which no per-asset check would catch.
      - name: Verify every platform reached the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSETS=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for pattern in '\.dmg$' '\.AppImage$' '\.deb$' '\.rpm$' '\.exe$'; do
            grep -qE "$pattern" <<< "$ASSETS" || {
              echo "The draft is missing an installer matching $pattern" >&2
              exit 1
            }
          done
          grep -qx 'latest.json' <<< "$ASSETS"

          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RUNNER_TEMP"
          node - "$RUNNER_TEMP/latest.json" "${GITHUB_REF_NAME#v}" <<'NODE'
          const [path, version] = process.argv.slice(2);
          const feed = JSON.parse(require("node:fs").readFileSync(path, "utf8"));
          if (feed.version !== version) process.exit(1);
          for (const key of ["darwin-aarch64", "linux-x86_64", "windows-x86_64"]) {
            const platform = feed.platforms?.[key];
            if (!platform?.signature || !platform?.url) {
              console.error(`latest.json has no signed bundle for ${key}`);
              process.exit(1);
            }
            if (!platform.url.startsWith("https://github.com/lucabmn/wavex/releases/download/")) {
              process.exit(1);
            }
          }
          NODE

      - name: Publish verified release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Smoke-test the public updater feed
        run: |
          set -euo pipefail
          FEED="$RUNNER_TEMP/latest.json"
          curl --fail --location --retry 10 --retry-all-errors --retry-delay 3 \
            "https://github.com/lucabmn/wavex/releases/latest/download/latest.json" \
            --output "$FEED"
          node - "$FEED" "${GITHUB_REF_NAME#v}" <<'NODE'
          const [path, version] = process.argv.slice(2);
          const feed = JSON.parse(require("node:fs").readFileSync(path, "utf8"));
          if (feed.version !== version) process.exit(1);
          for (const key of ["darwin-aarch64", "linux-x86_64", "windows-x86_64"]) {
            if (!feed.platforms?.[key]?.signature) process.exit(1);
          }
          NODE

      - name: Return a failed publication to draft
        if: failure() && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=true
