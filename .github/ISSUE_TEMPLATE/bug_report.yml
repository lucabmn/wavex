name: Bug report
description: Report a problem in wavex
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        wavex runs on macOS (Apple Silicon), Linux (x86-64), and Windows (x86-64).

  - type: input
    id: version
    attributes:
      label: wavex version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: "macOS 15.5 / Windows 11 23H2 / Ubuntu 24.04"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider CLI
      options:
        - Claude Code
        - Codex
        - Cursor
        - Grok Build
        - OpenCode
        - Pi
        - omp
        - fx
        - Multiple / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or console output
      description: Paste any relevant logs or console output. Redact secrets.
      render: text

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
